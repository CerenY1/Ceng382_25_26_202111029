<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <style>
        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 0, 1); }
            100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
        }

        body {
            background-image: url("https://i.pinimg.com/originals/74/05/ea/7405eaa3a27f0a1475bfb513da6ddf8f.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: flex-start;
            padding-top: 50px;
            align-items: center;
            margin: 0;
            transition: background 1.5s ease-in-out;
            flex-direction: column;
            gap: 20px;
        }

        .form-container {
            display: none;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            animation: glow 2s infinite alternate;
        }

        .form-container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: white;
            font-family: 'Great Vibes', cursive;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        input, textarea, button {
            width: 48%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
            font-family: 'Great Vibes', cursive;
        }

        textarea {
            width: 100%;
            height: 80px;
            font-family: 'Great Vibes', cursive;
        }

        input:focus, textarea:focus {
            border-color: gold;
            outline: none;
            animation: glow 1.5s infinite alternate;
        }

        button {
            width: 100%;
            margin-top: 10px;
            background-color: #0c5985;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            animation: glow 1.5s infinite alternate;
        }

        button:hover {
            background-color: #0c5985;
        }

        #table-container {
            width: 80%;
            max-height: 60vh;
            overflow: auto;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px;
        }

        table {
            width: 100%;
            font-size: 14px;
            font-family: 'Great Vibes', cursive;
            background: transparent;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: left;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: white;
        }

        th {
            background: rgba(12, 89, 133, 0.7);
            color: white;
        }

        tbody tr {
            transition: background-color 0.3s ease-in-out;
        }

        tbody tr:hover {
            background-color: rgba(161, 161, 161, 0.5);
        }

        .highlight {
            background-color: rgb(246, 182, 72) !important;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            width: 20px;
            height: 20px;
            padding: 2px;
            font-size: 12px;
            text-align: center;
            line-height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Class Information</h2>
        <div class="input-group">
            <input type="text" id="className" placeholder="Class Name">
            <input type="number" id="numPeople" placeholder="Number of People">
        </div>
        <div class="input-group">
            <textarea id="description" placeholder="Description"></textarea>
        </div>
        <button onclick="addClass()">Add Class</button>
    </div>
    
    <div id="table-container">
        <table id="classTable">
            <thead>
                <tr>
                    <th>Class Name</th>
                    <th>Number of People</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <script>
        function addClass() {
            let name = document.getElementById("className").value;
            let people = document.getElementById("numPeople").value;
            let desc = document.getElementById("description").value;
    
            if (name === "" || people === "" || desc === "") {
                alert("Please fill in all fields.");
                return;
            }
    
            let table = document.getElementById("classTable").getElementsByTagName('tbody')[0];
            let newRow = table.insertRow();
    
            newRow.innerHTML = `<td>${name}</td><td>${people}</td><td>${desc}</td>`;
    
            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "X";
            deleteBtn.className = "delete-btn";
    
            let lastCell = newRow.insertCell(-1);
            lastCell.appendChild(deleteBtn);
    
            deleteBtn.addEventListener("click", function () {
                let row = this.parentElement.parentElement;
                row.remove();
            });
    
            // Add row click event to log details and highlight the row
            newRow.addEventListener("click", function () {
                // Log the row details
                console.log("Class Name: " + name);
                console.log("Number of People: " + people);
                console.log("Description: " + desc);
    
                // Toggle highlight class
                this.classList.toggle("highlight");
            });
    
            // Clear the form fields
            document.getElementById("className").value = "";
            document.getElementById("numPeople").value = "";
            document.getElementById("description").value = "";
        }
    </script>
    
</body>
</html>
